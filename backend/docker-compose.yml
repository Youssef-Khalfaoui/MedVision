version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: medvision
      POSTGRES_PASSWORD: medvisionpass
      POSTGRES_DB: medvision
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata:
